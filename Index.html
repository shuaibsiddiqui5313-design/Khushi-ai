<title>KHUSHI AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=Hind:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen phone app. Header, scrolling panel, raised-mic bottom nav. Single dark neon world. */
:root{
  --bg:#060a22; --bg2:#0d1340; --panel:#111a4f; --line:#2a3790;
  --ink:#eaedff; --muted:#8e98d6;
  --blue:#4d7bff; --violet:#a35cff; --pink:#ff5ccf; --ok:#4de3b0; --warn:#ffc857;
  --display:'Sora','Hind',system-ui,sans-serif; --body:'Hind','Noto Sans Devanagari',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
#root{height:100%}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
.bgglow{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(60% 40% at 50% 28%,rgba(163,92,255,.28),transparent 70%),radial-gradient(70% 50% at 20% 100%,rgba(77,123,255,.22),transparent 70%)}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:radial-gradient(1px 1px at 20% 30%,#9fb0ff,transparent),radial-gradient(1px 1px at 70% 20%,#d6b3ff,transparent),radial-gradient(1.5px 1.5px at 85% 60%,#9fb0ff,transparent),radial-gradient(1px 1px at 35% 75%,#d6b3ff,transparent),radial-gradient(1px 1px at 10% 85%,#9fb0ff,transparent)}
header{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 6px}
.logo{font-family:var(--display);font-weight:800;letter-spacing:.18em;font-size:1.05rem;
  background:linear-gradient(90deg,var(--blue),var(--violet),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 10px rgba(163,92,255,.6))}
.chip{font-size:.75rem;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);display:flex;gap:6px;align-items:center;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.listen{background:var(--pink);box-shadow:0 0 10px var(--pink);animation:pulse 1s infinite}
.dot.speak{background:var(--violet);box-shadow:0 0 10px var(--violet);animation:pulse .6s infinite}
main{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-block:6px 16px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
h2{font-family:var(--display);font-size:1.15rem;margin:6px 0 10px}
.muted{color:var(--muted)}
/* avatar */
.avatarwrap{position:relative;display:grid;place-items:center;flex:none}
.avatarwrap.big{height:min(46vh,330px)}
.avatarwrap.small{height:92px}
.avatarwrap svg{height:100%;width:auto;max-width:100%;overflow:visible}
.ring{transform-origin:150px 150px;fill:none;stroke-width:1.5}
.r1{stroke:var(--blue);opacity:.7;animation:spin 14s linear infinite;stroke-dasharray:6 10}
.r2{stroke:var(--violet);opacity:.8;animation:spin 22s linear infinite reverse;stroke-dasharray:2 14}
.r3{stroke:var(--pink);opacity:.5;animation:pulse 3s ease-in-out infinite}
.face{animation:float 4.5s ease-in-out infinite;transform-origin:150px 160px}
.eye{transform-origin:center;transform-box:fill-box;animation:blink 5s infinite}
.mouth{transform-origin:150px 205px;transition:d .1s}
.state-speaking .mouth{animation:talk .28s ease-in-out infinite}
.state-listening .halo{animation:ripple 1.4s ease-out infinite}
.halo{fill:none;stroke:var(--pink);stroke-width:2;opacity:0;transform-origin:150px 150px}
.halo.h2{animation-delay:.45s!important}
.state-speaking .glowbody{animation:glow .7s ease-in-out infinite alternate}
.state-listening .ear{animation:pulse .8s infinite}
.cheek{opacity:.55}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes talk{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1.7)}}
@keyframes ripple{0%{opacity:.9;transform:scale(.7)}100%{opacity:0;transform:scale(1.35)}}
@keyframes glow{to{filter:drop-shadow(0 0 22px #a35cff)}}
/* voice */
.status{text-align:center;font-family:var(--display);font-weight:600;min-height:1.6em}
.heard{text-align:center;color:var(--muted);min-height:2.6em;padding:0 8px;font-size:.95rem}
.micwrap{display:grid;place-items:center;padding-block:10px 4px}
.mic{position:relative;width:92px;height:92px;border-radius:50%;border:0;color:#fff;cursor:pointer;display:grid;place-items:center;
  background:radial-gradient(circle at 30% 25%,#7fa0ff,var(--violet) 55%,#6a2fd8);
  box-shadow:0 0 0 6px rgba(163,92,255,.18),0 0 34px rgba(163,92,255,.8),0 0 70px rgba(77,123,255,.45)}
.mic.on{background:radial-gradient(circle at 30% 25%,#ff9be3,var(--pink) 55%,#c4208f);box-shadow:0 0 0 8px rgba(255,92,207,.2),0 0 44px rgba(255,92,207,.9);animation:pulse 1.1s infinite}
.mic svg{width:40px;height:40px}
.hint{text-align:center;font-size:.8rem;color:var(--muted);padding:6px 10px}
.notice{border:1px solid var(--warn);background:rgba(255,200,87,.08);color:#ffe6a8;border-radius:14px;padding:10px 12px;font-size:.88rem;margin:8px 0}
.notice.ok{border-color:var(--ok);background:rgba(77,227,176,.07);color:#bff5e3}
.quick{display:flex;gap:8px;overflow-x:auto;padding-block:6px;scrollbar-width:none}
.quick button{flex:none}
/* buttons / fields */
button{font-family:inherit}
.btn{border:1px solid var(--line);background:rgba(17,26,79,.8);color:var(--ink);border-radius:99px;padding:9px 14px;font-size:.88rem;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.pri{border-color:transparent;background:linear-gradient(90deg,var(--blue),var(--violet));box-shadow:0 0 18px rgba(124,92,255,.5)}
.btn:focus-visible,.mic:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
/* chat */
.msgs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-block:8px;scrollbar-width:none}
.msgs::-webkit-scrollbar{display:none}
.bub{max-width:86%;padding:10px 13px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.98rem}
.bub.k{align-self:flex-start;background:rgba(36,48,128,.75);border:1px solid var(--line);border-bottom-left-radius:5px;box-shadow:0 0 16px rgba(77,123,255,.18)}
.bub.u{align-self:flex-end;background:linear-gradient(135deg,var(--blue),var(--violet));border-bottom-right-radius:5px;box-shadow:0 0 16px rgba(163,92,255,.35)}
.bub small{display:block;opacity:.6;font-size:.7rem;margin-top:3px}
.speakbtn{background:none;border:0;color:var(--muted);cursor:pointer;padding:0;margin-top:4px;font-size:.78rem}
.typing{display:flex;gap:4px;padding:12px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--violet);animation:pulse .9s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.composer{display:flex;gap:8px;align-items:center;padding-block:8px}
.composer input{flex:1;min-width:0}
input[type=text],select,textarea{width:100%;background:rgba(10,16,60,.9);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:11px 13px;font:inherit;font-size:1rem}
.sendbtn{width:46px;height:46px;border-radius:50%;border:0;color:#fff;background:linear-gradient(135deg,var(--blue),var(--violet));cursor:pointer;display:grid;place-items:center;flex:none;box-shadow:0 0 16px rgba(124,92,255,.6)}
.sendbtn.mini{background:rgba(17,26,79,.9);border:1px solid var(--line);box-shadow:none}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.card{border:1px solid var(--line);background:linear-gradient(160deg,rgba(24,34,104,.85),rgba(14,20,70,.85));border-radius:18px;padding:12px;min-width:0;text-align:left;color:var(--ink);cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:6px}
.card:active{transform:scale(.98)}
.card .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#fff;background:linear-gradient(135deg,var(--blue),var(--violet));box-shadow:0 0 14px rgba(124,92,255,.5)}
.card b{font-family:var(--display);font-size:.92rem;font-weight:600}
.card span{font-size:.78rem;color:var(--muted)}
.card[disabled]{opacity:.55;cursor:not-allowed}
.tag{font-size:.68rem;border:1px solid var(--warn);color:var(--warn);border-radius:99px;padding:1px 8px;align-self:flex-start}
.tag.ok{border-color:var(--ok);color:var(--ok)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);background:rgba(14,20,70,.7);border-radius:16px;padding:12px;margin-bottom:10px}
.row>div{min-width:0}
.row label{font-weight:600;display:block}
.row small{color:var(--muted);display:block}
.sw{position:relative;width:50px;height:28px;border-radius:99px;border:1px solid var(--line);background:#0a1040;cursor:pointer;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:.2s}
.sw[aria-checked=true]{background:linear-gradient(90deg,var(--blue),var(--violet))}
.sw[aria-checked=true]::after{left:25px;background:#fff}
input[type=range]{width:100%;accent-color:var(--violet)}
.stack{display:flex;flex-direction:column;gap:8px}
.timer{font-family:var(--display);font-size:2rem;font-variant-numeric:tabular-nums;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:20;background:#1b2672;border:1px solid var(--violet);padding:9px 16px;border-radius:99px;font-size:.88rem;max-width:90vw;box-shadow:0 0 22px rgba(163,92,255,.5)}
/* nav */
nav{position:relative;z-index:3;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,transparent,rgba(6,10,34,.95) 30%)}
.tab{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;padding:6px 0;cursor:pointer}
.tab svg{width:24px;height:24px}
.tab[aria-selected=true]{color:#fff}
.tab[aria-selected=true] svg{filter:drop-shadow(0 0 8px var(--violet));color:var(--violet)}
.tab.center .orb{width:58px;height:58px;margin-top:-26px;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:radial-gradient(circle at 30% 25%,#7fa0ff,var(--violet) 60%,#6a2fd8);box-shadow:0 0 0 4px var(--bg),0 0 26px rgba(163,92,255,.9)}
.tab.center .orb svg{width:28px;height:28px;filter:none;color:#fff}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
(function(){
const {useState,useEffect,useRef,useCallback} = React;
const camel = s => s.replace(/-([a-z])/g,(_,c)=>c.toUpperCase());
function h(type,props,...kids){
  if(props){const p={};
    for(const k in props){let v=props[k],n=k;
      if(k==='class')n='className'; else if(k==='autocomplete')n='autoComplete';
      else if(/^[a-z]+(-[a-z]+)+$/.test(k)&&!/^(aria|data)-/.test(k))n=camel(k);
      if(n==='style'&&typeof v==='string'){v=Object.fromEntries(v.split(';').filter(x=>x.trim()).map(x=>{const i=x.indexOf(':');return [camel(x.slice(0,i).trim()),x.slice(i+1).trim()]}))}
      p[n]=v;}
    props=p;}
  return React.createElement(type,props,...kids);
}
const html = htm.bind(h);
const GREETING = "Hello! Main Khushi hoon. Aaj main aapki kya help kar sakti hoon?";

/* ---------- storage (safe) ---------- */
const ss = {get(k,d){try{const v=sessionStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{sessionStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const ls = {get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- Khushi's local brain (no paid API, no keys) ---------- */
const pick = a => a[Math.floor(Math.random()*a.length)];
const hasHindi = t => /[\u0900-\u097F]/.test(t);
const hinglishWords = /\b(kaise|kya|hai|hoon|ho|mujhe|mera|meri|tum|aap|batao|bolo|kholo|karo|namaste|shukriya|dhanyavad|aaj|kitne|baje|samay|tarikh|chutkula|haan|nahi|theek|accha|achha)\b/i;
const APPS = {
  youtube:["YouTube","https://www.youtube.com"], whatsapp:["WhatsApp","https://web.whatsapp.com"], google:["Google","https://www.google.com"],
  maps:["Maps","https://maps.google.com"], gmail:["Gmail","https://mail.google.com"], instagram:["Instagram","https://www.instagram.com"],
  facebook:["Facebook","https://www.facebook.com"], wikipedia:["Wikipedia","https://www.wikipedia.org"], spotify:["Spotify","https://open.spotify.com"],
  telegram:["Telegram","https://web.telegram.org"], x:["X","https://x.com"], amazon:["Amazon","https://www.amazon.in"], flipkart:["Flipkart","https://www.flipkart.com"]
};
function detectLang(t,pref){
  if(pref==='hi') return 'hi'; if(pref==='en') return 'en';
  return (hasHindi(t)||hinglishWords.test(t)) ? 'hi' : 'en';
}
function brain(raw, prefLang, mem){
  const t = raw.trim(); const l = t.toLowerCase();
  const lang = detectLang(t,prefLang); const H = lang==='hi';
  const out = (hi,en,extra) => Object.assign({text:H?hi:en,lang},extra||{});
  let m;
  if((m=l.match(/(?:mera naam|my name is|मेरा नाम)\s+([a-z\u0900-\u097F]{2,20})(?:\s+hai|\s+है)?$/i)) && !/khushi|kaun|kya|hoon$/.test(m[1])){
    const n=m[1][0].toUpperCase()+m[1].slice(1); mem.name=n;
    return out(`Nice to meet you, ${n}! Ab main is chat mein aapka naam yaad rakhungi.`,`Nice to meet you, ${n}! I'll remember your name for this chat.`,{mem});
  }
  if(/(mera naam kya|what is my name|what's my name|do you know my name|मेरा नाम क्या)/.test(l))
    return out(mem.name?`Aapka naam ${mem.name} hai.`:`Abhi tak aapne mujhe apna naam nahi bataya. "Mera naam ... hai" bolkar bata dijiye.`, mem.name?`Your name is ${mem.name}.`:`You haven't told me your name yet. Say "my name is ..." and I'll remember it.`);
  if(/(\btimer\b|टाइमर|\balarm\b)/.test(l)){
    const n=l.match(/(\d+)\s*(second|sec|सेकंड|minute|min|मिनट|मिनिट|ghanta|hour|घंटा)?/);
    if(n){const v=+n[1];const u=n[2]||'min';const sec=/sec|सेकंड/.test(u)?v:/hour|ghanta|घंटा/.test(u)?v*3600:v*60;
      return out(`Theek hai, ${v} ${u} ka timer Control section mein shuru kar diya. Alarm ke liye is app ko native Android permission chahiye, isliye yeh timer tab khuli rehne par hi bajega.`,`Started a ${v} ${u} timer in the Control section. It only rings while this page stays open, since real alarms need native Android permission.`,{action:{type:'timer',sec}});}
  }
  if((m=l.match(/(?:open|kholo|khol do|launch|खोलो|खोल दो)\s+([a-z]+)|([a-z]+)\s+(?:kholo|khol do|open karo|खोलो)/))){
    const key=(m[1]||m[2]);
    if(APPS[key]){const [nm,url]=APPS[key];
      return out(`${nm} ka link neeche hai. Tap karke kholiye. Bina Android permission ke main seedha phone ka app nahi khol sakti.`,`Here's the ${nm} link. Tap it to open. Without Android permission I can't launch phone apps directly.`,{links:[{label:'Open '+nm,url}]});}
  }
  if((m=l.match(/^(?:search|google|find|dhundo|khojo|खोजो)\s+(?:for\s+)?(.+)/))){
    const q=m[1];return out(`"${q}" ke liye search link taiyaar hai.`,`Search link ready for "${q}".`,{links:[{label:'Search: '+q,url:'https://www.google.com/search?q='+encodeURIComponent(q)}]});
  }
  if(/^[\d\s+\-*/().x×÷%]+$/.test(l) && /\d\s*[+\-*/x×÷%]\s*\d/.test(l)){
    try{const e=l.replace(/x|×/g,'*').replace(/÷/g,'/').replace(/(\d+(?:\.\d+)?)\s*%\s*(\d+)/g,'($1/100*$2)');const v=Function('"use strict";return ('+e+')')();
      if(isFinite(v)){const r=Math.round(v*1e6)/1e6;return out(`${t} = ${r}`,`${t} = ${r}`);}}catch(e){}
  }
  if((m=l.match(/(\d+(?:\.\d+)?)\s*(plus|minus|times|multiplied by|divided by|into)\s*(\d+(?:\.\d+)?)/))){
    const a=+m[1],b=+m[3];const v={plus:a+b,minus:a-b,times:a*b,'multiplied by':a*b,into:a*b,'divided by':b?a/b:NaN}[m[2]];
    if(isFinite(v))return out(`Jawab hai ${Math.round(v*1e6)/1e6}.`,`That's ${Math.round(v*1e6)/1e6}.`);
  }
  if(/(kaun ho|kaun hai tum|who are you|your name|tumhara naam|aapka naam|तुम कौन|आपका नाम|तुम्हारा नाम)/.test(l))
    return out(`Main Khushi hoon, aapki personal AI assistant. Main Hindi aur English dono mein baat kar sakti hoon.`,`I'm Khushi, your personal AI assistant. I can chat in Hindi and English.`);
  if(/(kaise ho|kaisi ho|how are you|कैसे हो|कैसी हो|aap kaise)/.test(l))
    return out(pick([`Main bilkul badhiya hoon! Aap kaise hain?`,`Ekdum mast! Aapka din kaisa ja raha hai?`]),pick([`I'm doing great, thanks for asking! How are you?`,`Feeling bright and glowy! How's your day going?`]));
  if(/(\btime\b|samay|kitne baje|टाइम|समय|कितने बजे)/.test(l)){
    const tm=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    return out(`Abhi samay ${tm} hai.`,`It's ${tm} right now.`);
  }
  if(/(\bdate\b|tarikh|aaj kya din|\btoday\b|तारीख)/.test(l)){
    const d=new Date().toLocaleDateString([], {weekday:'long',day:'numeric',month:'long',year:'numeric'});
    return out(`Aaj ${d} hai.`,`Today is ${d}.`);
  }
  if(/(joke|chutkula|मजाक|चुटकुला|hasao)/.test(l)){
    const J=[["Teacher: Tum school late kyun aaye? Student: Sir, board pe likha tha 'School ahead, go slow'!","Why did the phone wear glasses? It lost its contacts!"],
      ["Pappu: Mere paas ek idea hai! Dost: Kya? Pappu: Woh bhi so gaya, chalo kal baat karte hain.","I told my computer I needed a break. Now it won't stop sending me Kit-Kat ads."],
      ["Doctor: Aapko bhoolne ki bimari hai. Patient: Kab se? Doctor: Kab se kya?","Why was the AI calm? It had plenty of processing time to relax."]];
    const j=pick(J);return out(j[0],j[1]);
  }
  if(/(thank|shukriya|dhanyavad|धन्यवाद|शुक्रिया|thanks)/.test(l))
    return out(pick([`Koi baat nahi! Aur kuch chahiye?`,`Aapki madad karke khushi hui!`]),pick([`You're welcome! Anything else?`,`Happy to help!`]));
  if(/(weather|mausam|मौसम|barish)/.test(l))
    return out(`Live mausam ke liye internet data chahiye, jo is demo mein joda nahi gaya. Neeche ka link kholiye.`,`Live weather needs a data service that this demo doesn't include. Use the link below.`,{links:[{label:'Check weather',url:'https://www.google.com/search?q=weather'}]});
  if(/(motivat|inspire|himmat|प्रेरणा|udaas|sad|thaka)/.test(l))
    return out(pick([`Chhote kadam bhi aapko door tak le jaate hain. Aaj ek kaam poora kijiye, baaki kal dekhenge.`,`Aap jitna sochte hain usse zyada kar sakte hain. Main aapke saath hoon.`]),pick([`Small steps still take you far. Finish one thing today and let the rest wait.`,`You can do more than you think. I'm right here with you.`]));
  if(/(help|madad|kya kar sakti|what can you do|मदद|features)/.test(l))
    return out(`Main yeh kar sakti hoon:\n- Hindi aur English mein baat\n- Samay, tarikh, calculation, jokes\n- "5 minute timer" jaise timer\n- "open youtube" jaise app links\n- "search ..." se Google link\nVoice tab mein mic dabakar bol sakte hain.`,`Here's what I can do:\n- Chat in Hindi and English\n- Time, date, math, jokes\n- Timers like "5 minute timer"\n- App links like "open youtube"\n- "search ..." for a Google link\nTap the mic in the Voice tab to talk.`);
  if(/(bye|alvida|good night|shubh ratri|अलविदा|शुभ रात्रि)/.test(l))

    return out(GREETING,GREETING+" (I can also speak English.)");

    pick([`I heard: "${t}". This demo only handles basic requests. Try "help" to see what I can do.`,`I didn't fully get that. Could you rephrase? Say "help" and I'll list what I can do.`]));

/* ---------- helpers ---------- */
const uid = () => Math.random().toString(36).slice(2,9);
const nowT = () => new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
function beep(){
  try{const c=new (window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(d=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.2,c.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d+.2);o.start(c.currentTime+d);o.stop(c.currentTime+d+.22)})}catch(e){}
}
const fmt = s => { s=Math.max(0,Math.ceil(s)); const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60; return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(x).padStart(2,'0'); };

function App(){
  const [tab,setTab]=useState('voice');
  const [settings,setSettings]=useState(()=>Object.assign({},DEF,ls.get('khushi-settings',{})));
  const [messages,setMessages]=useState(()=>ss.get('khushi-chat',[{id:'g',role:'k',text:GREETING,time:nowT(),lang:'hi'}]));
  const [mem,setMem]=useState(()=>ss.get('khushi-mem',{}));
  const [status,setStatus]=useState('idle');
  const [interim,setInterim]=useState('');
  const [notice,setNotice]=useState(null);
  const [input,setInput]=useState('');
  const [toast,setToast]=useState('');
  const [voices,setVoices]=useState([]);
  const [timerEnd,setTimerEnd]=useState(null);
  const [left,setLeft]=useState(0);
  const [wake,setWake]=useState(false);
  const [full,setFull]=useState(false);
  const recRef=useRef(null), sendRef=useRef(null), wakeRef=useRef(null), msgsRef=useRef(null), toastT=useRef(null);

  useEffect(()=>{ls.set('khushi-settings',settings)},[settings]);
  useEffect(()=>{ss.set('khushi-chat',messages); ss.set('khushi-mem',mem);},[messages,mem]);
  useEffect(()=>{const el=msgsRef.current; if(el) el.scrollTop=el.scrollHeight;},[messages,tab,status]);
  useEffect(()=>{
    if(!SYN) return; const load=()=>setVoices(SYN.getVoices()||[]); load();
    SYN.addEventListener&&SYN.addEventListener('voiceschanged',load);
    return ()=>{SYN.removeEventListener&&SYN.removeEventListener('voiceschanged',load)};
  },[]);
  useEffect(()=>{
    if(!timerEnd) return;
    const id=setInterval(()=>{const r=(timerEnd-Date.now())/1000; setLeft(r);
      if(r<=0){clearInterval(id);setTimerEnd(null);setLeft(0);beep();try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}
        say('Timer complete!'); speakText('Timer poora ho gaya.', 'hi');}},250);
    return ()=>clearInterval(id);
  },[timerEnd]);
  useEffect(()=>{const f=()=>setFull(!!document.fullscreenElement);document.addEventListener('fullscreenchange',f);return()=>document.removeEventListener('fullscreenchange',f)},[]);

  const say = t => {setToast(t);clearTimeout(toastT.current);toastT.current=setTimeout(()=>setToast(''),3200)};
  const set = (k,v)=>setSettings(s=>Object.assign({},s,{[k]:v}));

  /* ----- text to speech ----- */
  const pickVoice = (replyLang) => {
    if(!voices.length) return null;
    if(settings.voiceURI){const v=voices.find(v=>v.voiceURI===settings.voiceURI); if(v) return v;}
    const want = replyLang==='hi' ? ['hi','en-IN','en'] : [settings.lang.startsWith('en')?settings.lang:'en-IN','en-IN','en'];
    for(const w of want){
      const pool=voices.filter(v=>v.lang.replace('_','-').toLowerCase().startsWith(w.toLowerCase()));
      if(pool.length) return pool.find(v=>FEMALE.test(v.name))||pool[0];
    }
    return null;
  };
  const stopSpeak = ()=>{try{SYN&&SYN.cancel()}catch(e){} setStatus(s=>s==='speaking'?'idle':s)};
  const speakText = (text,replyLang)=>{
    if(!SYN||typeof SpeechSynthesisUtterance==='undefined'){setNotice({kind:'warn',text:'Spoken replies are not supported in this browser. You can still read Khushi\'s answers on screen.'});return;}
    try{
      SYN.cancel();
      const u=new SpeechSynthesisUtterance(text.replace(/^- /gm,'').replace(/\n+/g,'. '));
      const v=pickVoice(replyLang); if(v){u.voice=v;u.lang=v.lang;} else u.lang= replyLang==='hi'?'hi-IN':'en-IN';
      u.rate=settings.rate;u.pitch=settings.pitch;
      u.onstart=()=>setStatus('speaking'); u.onend=()=>setStatus(s=>s==='speaking'?'idle':s);
      u.onerror=()=>setStatus(s=>s==='speaking'?'idle':s);
      SYN.speak(u);
    }catch(e){setNotice({kind:'warn',text:'Could not start speech on this device.'})}
  };

  /* ----- send & reply ----- */
  const send = (text,fromVoice)=>{
    const t=text.trim(); if(!t) return;
    setMessages(m=>m.concat({id:uid(),role:'u',text:t,time:nowT()}));
    setInput('');setInterim('');setStatus('thinking');
    setTimeout(()=>{
      const memCopy=Object.assign({},mem);
      const r=brain(t,settings.reply,memCopy);
      if(r.mem) setMem(memCopy);
      if(r.action&&r.action.type==='timer'){setTimerEnd(Date.now()+r.action.sec*1000);setLeft(r.action.sec);}
      setMessages(m=>m.concat({id:uid(),role:'k',text:r.text,links:r.links,time:nowT(),lang:r.lang}));
      setStatus('idle');
      if(settings.autoSpeak) speakText(r.text,r.lang);
    },fromVoice?250:450);
  };
  sendRef.current=send;

  /* ----- voice input ----- */
  const stopListen=()=>{try{recRef.current&&recRef.current.stop()}catch(e){}};

    if(!SR){setNotice({kind:'warn',text:'Voice input is not supported in this browser. Open this app in Chrome on Android, or type in the Chat section.'});return;}

    r.onstart=()=>{setStatus('listening');setNotice(null);setInterim('')};

    r.onerror=e=>{
      const M={'not-allowed':'Microphone access was blocked. Allow the microphone for this page, or open the standalone copy of KHUSHI AI in Chrome on Android. Typing in Chat always works.',

    };

    recRef.current=r;

  };

  const toggleWake=async()=>{

  };
  const vib=()=>{ if(!navigator.vibrate){say('Vibration is not supported here');return;} try{const ok=navigator.vibrate([200,100,200]);say(ok?'Vibrating':'The browser blocked vibration');}catch(e){say('Vibration is blocked')} };
  const fs=async()=>{ try{ if(document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); }catch(e){say('Fullscreen is not available here')} };
  const copyLast=async()=>{ const l=[...messages].reverse().find(m=>m.role==='k'); try{await navigator.clipboard.writeText(l?l.text:'');say('Copied Khushi\'s last reply');}catch(e){say('Copy was blocked by the browser')} };
  const startTimer=s=>{setTimerEnd(Date.now()+s*1000);setLeft(s);say('Timer started')};
  const needNative=n=>say(n+' needs a native Android app with permission. Not available in a web page.');
  const clearChat=()=>{stopSpeak();const g=[{id:uid(),role:'k',text:GREETING,time:nowT(),lang:'hi'}];setMessages(g);setMem({});say('Chat cleared')};

  const st = status==='listening'?'Sun rahi hoon… Listening':status==='speaking'?'Khushi bol rahi hai…':status==='thinking'?'Soch rahi hoon…':'Tap the mic and speak';
  const lastK=[...messages].reverse().find(m=>m.role==='k');
  const quick=['Time kya hua?','Tell me a joke','5 minute timer','12 * 7','Open YouTube','Help'];

  const Notice = notice && html`<div class="notice" role="alert">${notice.text}</div>`;
  const micSupport = SR ? null : html`<div class="notice">Voice input is not available in this browser. Chat by typing, or use Chrome on Android.</div>`;

  /* ----- views ----- */
  const VoiceView = html`<div class="scroll">
    <${Avatar} state=${status} />
    <div class="status" aria-live="polite">${st}</div>
    <div class="heard">${interim?html`<span>“${interim}”</span>`:(lastK?lastK.text.split('\n')[0].slice(0,140):'')}</div>
    <div class="micwrap"><button class=${'mic '+(status==='listening'?'on':'')} onClick=${toggleMic} aria-label=${status==='listening'?'Stop listening':'Start listening'}>${I.mic()}</button></div>
    <div class="hint">${status==='listening'?'Tap again to stop':status==='speaking'?html`<button class="btn" onClick=${stopSpeak}>Stop speaking</button>`:'Bol kar poochiye, ya neeche se chuniye'}</div>
    ${Notice}${micSupport}
    <div class="quick">${quick.map(q=>html`<button key=${q} class="btn" onClick=${()=>send(q)}>${q}</button>`)}</div>
    <div class="row" style="margin-top:6px"><div><label>Hear greeting</label><small>Tap to hear Khushi's hello</small></div><button class="btn pri" onClick=${()=>speakText(GREETING,'hi')}>Play</button></div>
  </div>`;

  const ChatView = html`<div style="display:flex;flex-direction:column;flex:1;min-height:0">
    <${Avatar} state=${status} small=${true} />
    <div class="msgs" ref=${msgsRef} aria-live="polite">
      ${messages.map(m=>html`<div key=${m.id} class=${'bub '+m.role}>
        ${m.text}
        ${m.links&&m.links.map(l=>html`<div key=${l.url} style="margin-top:8px"><a class="btn pri" style="display:inline-block;text-decoration:none;color:#fff" href=${l.url} target="_blank" rel="noopener">${l.label}</a></div>`)}

        ${m.role==='k'&&html`<button class="speakbtn" onClick=${()=>speakText(m.text,m.lang||'en')}>🔊 Listen</button>`}
      </div>`)}

    </div>

    </form>
  </div>`;

  const ControlView = html`<div class="scroll">

      <div class="quick" style="justify-content:center;flex-wrap:wrap">
        ${[1,5,10].map(m=>html`<button key=${m} class="btn" onClick=${()=>startTimer(m*60)}>${m} min</button>`)}
        <button class="btn" onClick=${()=>{setTimerEnd(null);setLeft(0)}}>Stop</button>
      </div>
      <small class="muted" style="text-align:center">Timer rings only while this page is open</small>
    </div>

    <div class="grid" style="margin-bottom:14px">
      <button class="card" onClick=${vib}><div class="ic">V</div><b>Vibrate</b><span>Test phone vibration</span><i class="tag ok">Browser</i></button>
      <button class="card" onClick=${fs}><div class="ic">F</div><b>${full?'Exit fullscreen':'Fullscreen'}</b><span>Hide browser bars</span><i class="tag ok">Browser</i></button>
      <button class="card" onClick=${copyLast}><div class="ic">C</div><b>Copy reply</b><span>Copy Khushi's last answer</span><i class="tag ok">Browser</i></button>

    </div>

  const AppsView = html`<div class="scroll">
    <h2>Apps</h2>
    <div class="notice">These are web links that open in a new tab. Launching installed Android apps needs a native app with permission.</div>
    <div class="grid">
      ${Object.keys(APPS).map(k=>html`<a key=${k} class="card" href=${APPS[k][1]} target="_blank" rel="noopener" style="text-decoration:none"><div class="ic">${APPS[k][0][0]}</div><b>${APPS[k][0]}</b><span>${APPS[k][1].replace('https://','').replace('www.','')}</span></a>`)}
    </div>
    <div class="hint">Tip: say or type “open youtube” and Khushi will show the link.</div>
  </div>`;

  const sorted=[...voices].sort((a,b)=>{const s=v=>(v.lang.toLowerCase().startsWith(settings.lang.slice(0,2))?0:1)*2+(FEMALE.test(v.name)?0:1);return s(a)-s(b)});
  const hasFemale=voices.some(v=>FEMALE.test(v.name));
  const SettingsView = html`<div class="scroll">
    <h2>Settings</h2>
    <div class="stack">
      <div class="row" style="flex-direction:column;align-items:stretch"><label for="s-lang">Voice input language</label><select id="s-lang" value=${settings.lang} onChange=${e=>set('lang',e.target.value)}>
        <option value="hi-IN">हिन्दी (India)</option><option value="en-IN">English (India)</option><option value="en-US">English (US)</option><option value="en-GB">English (UK)</option></select>
        <small>Used for the microphone and to choose a voice</small></div>
      <div class="row" style="flex-direction:column;align-items:stretch"><label for="s-reply">Reply language</label><select id="s-reply" value=${settings.reply} onChange=${e=>set('reply',e.target.value)}>
        <option value="auto">Auto (match what I say)</option><option value="hi">Hindi (Hinglish)</option><option value="en">English</option></select></div>
      <div class="row" style="flex-direction:column;align-items:stretch"><label for="s-voice">Khushi's voice</label>
        ${SYN?html`<select id="s-voice" value=${settings.voiceURI} onChange=${e=>set('voiceURI',e.target.value)}><option value="">Automatic (female voice if found)</option>
          ${sorted.map(v=>html`<option key=${v.voiceURI} value=${v.voiceURI}>${v.name} · ${v.lang}</option>`)}</select>
          <small>${voices.length?(hasFemale?'A female-sounding voice was found on this device.':'No voice here is labelled female, so Khushi uses your device default. Raise the pitch below for a lighter tone.'):'No voices have loaded yet. They can take a moment on Android.'}</small>`
          :html`<div class="notice">Speech synthesis is not supported in this browser.</div>`}</div>
      <div class="row" style="flex-direction:column;align-items:stretch"><label for="s-rate">Speed ${settings.rate.toFixed(2)}</label><input id="s-rate" type="range" min="0.6" max="1.5" step="0.05" value=${settings.rate} onInput=${e=>set('rate',+e.target.value)} />
        <label for="s-pitch" style="margin-top:8px">Pitch ${settings.pitch.toFixed(2)}</label><input id="s-pitch" type="range" min="0.8" max="1.8" step="0.05" value=${settings.pitch} onInput=${e=>set('pitch',+e.target.value)} />
        <div><button class="btn pri" style="margin-top:10px" onClick=${()=>speakText('Hello! Main Khushi hoon. Yeh meri awaaz hai.','hi')}>Test voice</button></div></div>
      <div class="row"><div><label id="l-auto">Speak replies aloud</label><small>Khushi reads each answer</small></div><button class="sw" role="switch" aria-labelledby="l-auto" aria-checked=${settings.autoSpeak} onClick=${()=>set('autoSpeak',!settings.autoSpeak)}></button></div>
      <div class="row"><div><label>Clear this chat</label><small>Chat is remembered until you close the tab</small></div><button class="btn" onClick=${clearChat}>Clear</button></div>
      <div class="row" style="flex-direction:column;align-items:stretch"><label>This device</label>
        <small>Voice input: ${SR?'supported':'not supported'}</small><small>Spoken replies: ${SYN?'supported':'not supported'}</small>
        <small>Keep awake: ${'wakeLock' in navigator?'supported':'not supported'}</small><small>Vibration: ${navigator.vibrate?'supported':'not supported'}</small>
        <small style="margin-top:6px">No API keys are used. Khushi's answers come from a small built-in brain, so nothing is sent to a paid service.</small></div>
    </div>
  </div>`;

  const views={voice:VoiceView,chat:ChatView,control:ControlView,apps:AppsView,settings:SettingsView};
  const tabs=[['chat','Chat',I.chat],['control','Control',I.ctl],['voice','Voice',I.mic],['apps','Apps',I.apps],['settings','Settings',I.set]];
  return html`<div class="app">
    <div class="bgglow"></div><div class="stars"></div>
    <header><div class="logo">KHUSHI AI</div><div class="chip"><span class=${'dot '+(status==='listening'?'listen':status==='speaking'?'speak':'')}></span>${status==='listening'?'Listening':status==='speaking'?'Speaking':status==='thinking'?'Thinking':'Online'}</div></header>
    <main>${views[tab]}</main>
    ${toast&&html`<div class="toast" role="status">${toast}</div>`}
    <nav role="tablist">${tabs.map(([k,label,ic])=>html`<button key=${k} role="tab" aria-selected=${tab===k} class=${'tab'+(k==='voice'?' center':'')} onClick=${()=>{setTab(k);if(k!=='voice'&&status==='listening')stopListen();}}>
      ${k==='voice'?html`<span class="orb">${ic()}</span>`:ic()}<span>${label}</span></button>`)}</nav>
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
})();
</script>
